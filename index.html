<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujal - UI/UX Designer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for a clean look similar to the design -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="mailto:Sujalpratapsingh70@gmail.com" class="email"><i class="ph-light ph-envelope"></i> Email</a>
            <div class="menu-btn">
                <i class="ph ph-list"></i>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="main-content">
            <!-- Left Column -->
            <div class="col-left">
                <div class="hero-text">
                    <h1>Hi,<br>I'm <span class="highlight">Sujal</span></h1>
                    <h2>• Busy Exploring every Rabbit Hole</h2>
                </div>
            </div>

            <!-- Middle Column (Image) -->
            <div class="col-center">
                <!-- Using a placeholder similar to a portrait -->
                <img src="sujal-portrait.jpg" alt="Sujal Portrait" class="portrait">
            </div>

            <!-- Right Column -->
            <div class="col-right">
                <div class="abstract-shapes">
                    <div class="circle-outline"></div>
                    <div class="circle-small-outline"></div>
                    <div class="circle-solid"></div>
                </div>
                <div class="info-section">
                    <h3 class="section-title">Catching the Wind</h3>
                    <p class="expert-text">Drifting the digital sea,<br>tangled in my next obsession.</p>
                    <p class="description">A quiet corner where I explore tech,<br>get lost in philosophy books, and<br>try to make sense of it all.</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-left">
                <div class="social-links">
                    <a href="https://github.com/sjlptpsnh" target="_blank"><i class="ph-light ph-github-logo"></i></a>
                    <a href="https://www.linkedin.com/in/sjlptpsnh" target="_blank"><i class="ph-light ph-linkedin-logo"></i></a>
                    <a href="https://instagram.com/sjlptpsnh" target="_blank"><i class="ph-light ph-instagram-logo"></i></a>
                    <a href="https://twitter.com/sjlptpsnh" target="_blank"><i class="ph-light ph-x-logo"></i></a>
                </div>
            </div>
            <a href="https://t.me/sjlptpsnh" target="_blank" class="chat-btn">
                Let's Chat <i class="ph-fill ph-chat-circle-dots"></i>
            </a>
        </footer>
    </div>
</body>
</html>
